name: Suggest a program
description: National professional learning for K-12 teachers or informal educators, run by a society, a US federal agency, the Smithsonian, or a national foundation.
title: "Add: "
labels: ["add program"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! We list national professional learning for K-12 teachers and informal educators in STEM+ fields,
        run by a national scholarly or professional society or association, a US federal agency, a national
        program with federal agency funds, the Smithsonian, or a national private foundation or nonprofit.
        **State, regional, and district professional development is not listed**, and neither are university
        courses, company programs, or programs open only to teachers in one city or state. If we are not sure a program meets this rule, we leave it out. A maintainer checks the
        provider's pages before listing it.
  - type: input
    id: name
    attributes: {label: "Program name", placeholder: "e.g. NOAA Teacher at Sea"}
    validations: {required: true}
  - type: input
    id: provider
    attributes: {label: "Society, association, or agency that runs or funds it", placeholder: "e.g. NOAA Fisheries"}
    validations: {required: true}
  - type: dropdown
    id: sponsor_type
    attributes:
      label: Run or funded by
      options: ["US society", "International society", "US federal agency", "Federally funded program", "Smithsonian Institution", "Private foundation or nonprofit"]
    validations: {required: true}
  - type: input
    id: url
    attributes: {label: "Link to the provider's own page about the program", description: "This is how we check who runs it."}
    validations: {required: true}
  - type: checkboxes
    id: audiences
    attributes:
      label: Who it is for
      options:
        - label: K-12 teachers
        - label: Informal educators (museums, zoos, aquariums, parks, nature centers, libraries, after-school, outreach)
  - type: input
    id: grades
    attributes: {label: "Grade bands, if limited", placeholder: "e.g. grades 6-12"}
  - type: dropdown
    id: type
    attributes:
      label: Kind of program
      options: ["Research experience", "Field, ship, or park experience", "Fellowship", "Workshop or institute", "Online course", "Webinar series", "Coaching or mentoring", "Certification training"]
    validations: {required: true}
  - type: input
    id: cost
    attributes: {label: "Cost, stipend, or support", placeholder: "e.g. free, $100 stipend, $600 fee"}
  - type: input
    id: deadline
    attributes: {label: "Next application deadline, if announced", placeholder: "YYYY-MM-DD, or 'usually in March'"}
  - type: input
    id: schedule
    attributes: {label: "When it runs", placeholder: "e.g. six weeks every summer; webinars monthly"}
  - type: checkboxes
    id: confirm
    attributes:
      label: Scope check
      options:
        - label: It is a national program (not a state, regional, or district one), and the society, association, or agency named above runs or funds it, as its own pages show.
          required: true
