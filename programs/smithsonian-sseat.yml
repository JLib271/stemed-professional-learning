schedule: Week-long academies each summer in Washington, DC; topics change from year to year (recent ones covered biodiversity and energy). The center also runs virtual academies and free webinars.
summary: About 20-30 K-12 teachers spend a week behind the scenes at Smithsonian museums and research centers, working with scientists, curators, and collections on a STEM theme.
